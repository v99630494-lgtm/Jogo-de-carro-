<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Highway Avoid - Sobreviva</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #ff3b30;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #score-box {
            border-color: #00ecff;
            box-shadow: 0 0 15px rgba(0, 236, 255, 0.4);
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 45px;
            color: #ff3b30;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.8);
            text-align: center;
        }
        p {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #ff3b30 0%, #a10000 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.4);
            pointer-events: auto;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            width: 80%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #mobile-controls {
            position: absolute;
            bottom: 90px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 15;
            pointer-events: auto;
        }
        .touch-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud">
            <div id="score-box" class="hud-box">PONTOS: <span id="score-val">0</span></div>
            <div id="speed-box" class="hud-box">KM/H: <span id="speed-val">180</span></div>
        </div>
        
        <div id="mobile-controls">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>

        <div id="instructions">Use as setas/AD no teclado ou os botões na tela para desviar</div>
    </div>

    <div id="game-over-screen">
        <h1>VOCÊ EXPLODIU!</h1>
        <p>Pontuação: <b id="final-score" style="color: #00ecff; font-size: 28px;">0</b></p>
        <button class="btn" onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <!-- Script de fallback otimizado -->
    <script src="https://unpkg.com"></script>

    <script>
        let scene, camera, renderer;
        let playerCar, obstacles = [], particles = [];
        let speed = 1.2;
        let score = 0;
        let isGameOver = false;
        let roadSegments = [];
        let laneWidth = 3.5;
        let lanes = [-laneWidth, 0, laneWidth];
        let keys = { Left: false, Right: false };
        let lastObstacleTime = 0;
        let obstacleInterval = 1000; 

        function init() {
            if (typeof THREE === 'undefined') {
                document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Erro ao carregar os gráficos 3D. Por favor, suba o código para o GitHub Pages para jogar!</h2>";
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);
            scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 9);
            camera.lookAt(new THREE.Vector3(0, 1, -5));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x222233, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            createRoad();

            playerCar = createVehicle(0xff0033, true);
            playerCar.position.set(0, 0.4, 2);
            scene.add(playerCar);

            // Controles de Teclado
            window.addEventListener('keydown', e => handleInput(e, true));
            window.addEventListener('keyup', e => handleInput(e, false));
            
            // Controles Touch para Celular
            setupMobileControls();

            window.addEventListener('resize', onWindowResize);
            animate(0);
        }

        function createVehicle(colorHex, isPlayer = false) {
            const carGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.1, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.5, 0.5, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.0 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.75, -0.1);
            carGroup.add(cabin);

            return carGroup;
        }

        function createRoad() {
            const roadLength = 100;
            const roadWidth = 12;

            for (let i = 0; i < 3; i++) {
                const segment = new THREE.Group();
                segment.position.z = -i * roadLength;

                const asphaltGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
                const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
                const asphalt = new THREE.Mesh(asphaltGeo, asphaltMat);
                asphalt.rotation.x = -Math.PI / 2;
                segment.add(asphalt);

                const leftLineGeo = new THREE.PlaneGeometry(0.3, roadLength);
                const sideLineMat = new THREE.MeshBasicMaterial({ color: 0x00ecff });
                const leftLine = new THREE.Mesh(leftLineGeo, sideLineMat);
                leftLine.rotation.x = -Math.PI / 2;
                leftLine.position.set(-roadWidth/2, 0.02, 0);
                
                const rightLine = leftLine.clone();
                rightLine.position.x = roadWidth/2;
                segment.add(leftLine, rightLine);

                scene.add(segment);
                roadSegments.push(segment);
            }
        }

        function handleInput(event, isPressed) {
            if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') keys.Left = isPressed;
            if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') keys.Right = isPressed;
        }

        function setupMobileControls() {
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.Left = true; });
