<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Highway Avoid - Sobreviva</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #ff3b30;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #score-box {
            border-color: #00ecff;
            box-shadow: 0 0 15px rgba(0, 236, 255, 0.4);
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 60px;
            color: #ff3b30;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.8);
            animation: pulse 1.5s infinite alternate;
        }
        p {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #ff3b30 0%, #a10000 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 59, 48, 0.6);
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud">
            <div id="score-box" class="hud-box">PONTOS: <span id="score-val">0</span></div>
            <div id="speed-box" class="hud-box">KM/H: <span id="speed-val">180</span></div>
        </div>
        <div id="instructions">Use as setas <b style="color:#00ecff">ESQUERDA / DIREITA</b> ou <b style="color:#00ecff">A / D</b> para desviar</div>
    </div>

    <div id="game-over-screen">
        <h1>VOCÊ EXPLODIU!</h1>
        <p>Sua pontuação final foi de: <b id="final-score" style="color: #00ecff; font-size: 28px;">0</b> pontos</p>
        <button class="btn" onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <!-- Importando Three.js de um servidor CDN confiável -->
    <script src="https://cloudflare.com"></script>

    <script>
        let scene, camera, renderer;
        let playerCar, obstacles = [], particles = [];
        let speed = 1.2;
        let score = 0;
        let isGameOver = false;
        let roadSegments = [];
        let laneWidth = 3.5;
        let lanes = [-laneWidth, 0, laneWidth];
        let keys = { Left: false, Right: false };
        
        // Configurações de tempo para gerar carros obstáculo
        let lastObstacleTime = 0;
        let obstacleInterval = 1000; 

        const container = document.getElementById('canvas-container');

        function init() {
            // 1. Criar a Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);
            scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

            // 2. Câmera Cinematográfica Traseira
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 9);
            camera.lookAt(new THREE.Vector3(0, 1, -5));

            // 3. Renderizador com Sombras e Antialiasing (Suavização de bordas)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // 4. Iluminação Realista (Noite Urbana)
            const ambientLight = new THREE.AmbientLight(0x222233, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Luzes de Postes/Neon falsas na estrada
            const neonLight = new THREE.PointLight(0x00ecff, 2, 30);
            neonLight.position.set(0, 10, -20);
            scene.add(neonLight);

            // 5. Criar a Estrada Infinita
            createRoad();

            // 6. Criar o Carro do Jogador (Esportivo Vermelho)
            playerCar = createVehicle(0xff0033, true);
            playerCar.position.set(0, 0.4, 2);
            scene.add(playerCar);

            // Eventos de teclado
            window.addEventListener('keydown', e => handleInput(e, true));
            window.addEventListener('keyup', e => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            // Iniciar o loop de animação
            animate(0);
        }

        // Construtor avançado de carros usando formas geométricas básicas combinadas
        function createVehicle(colorHex, isPlayer = false) {
            const carGroup = new THREE.Group();

            // Chassi/Carroceria Principal
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.1, 
                metalness: 0.8 
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            body.castShadow = true;
            body.receiveShadow = true;
            carGroup.add(body);

            // Cabine/Vidros
            const cabinGeo = new THREE.BoxGeometry(1.5, 0.5, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.0, metalness: 1.0 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.75, -0.1);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Rodas Metálicas com Pneu Preto
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-0.95, 0.1, 1.1],  // Traseira Esquerda
                [0.95, 0.1, 1.1],   // Traseira Direita
                [-0.95, 0.1, -1.1], // Dianteira Esquerda
                [0.95, 0.1, -1.1]   // Dianteira Direita
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            // Faróis Dianteiros Xenon
            const lightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.6, 0.4, -1.91);
            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.6, 0.4, -1.91);
            carGroup.add(leftLight, rightLight);

            // Lanternas Traseiras de Freio (Vermelho brilhante)
            const tailLightMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0xff0000 : 0xaa0000 });
